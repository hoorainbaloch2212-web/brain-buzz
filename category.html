<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Select Category - BrainBuzz</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="category-container">

        <h1>Select a Category</h1>

        <div class="categories">

            <div class="card" data-category="kids">
                👶
                <h2>Kids</h2>
                <p>Fun and easy questions</p>
            </div>

            <div class="card" data-category="students">
                📚
                <h2>Students (1-10)</h2>
                <p>School level questions</p>
            </div>

            <div class="card" data-category="tech">
                💻
                <h2>Tech</h2>
                <p>Technology and computers</p>
            </div>

            <div class="card" data-category="nontech">
                🌎
                <h2>Non-Tech</h2>
                <p>General knowledge & fun facts</p>
            </div>

        </div>

    </div>

    <script src="script.js"></script>

</body>
</html>
